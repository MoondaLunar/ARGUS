server.port=${PORT:8080}

# Default local store: a file-backed H2 database so evidence survives restarts
# and does not require a database install. Point these at Postgres for a
# deployment (see README).
spring.datasource.url=${ARGUS_DB_URL:jdbc:h2:file:./data/argus;AUTO_SERVER=TRUE}
spring.datasource.username=${ARGUS_DB_USER:sa}
spring.datasource.password=${ARGUS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Hibernate Envers keeps _AUD history tables for the audited entities
spring.jpa.properties.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.hibernate.envers.store_data_at_delete=true

logging.level.org.hibernate.SQL=warn

# Optional: require a detached PGP signature (X-PGP-Signature) on /api/**.
# Leave blank to run open on localhost. Point it at a public key to turn the gate on.
argus.pgp.public-key=${ARGUS_PGP_PUBLIC_KEY:}
